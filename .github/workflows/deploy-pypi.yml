name: Publish rich-codex to PyPI
on:
  release:
    types: [published]

jobs:
  build-n-publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rich-codex
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Check out source-code repository
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install python dependencies
        run: python -m pip install --upgrade pip setuptools wheel build

      - name: Build the distribution
        run: python -m build

      - name: Publish to PyPI
        if: github.repository == 'ewels/rich-codex'
        # Pinned to the branch that PyPA maintains for this purpose, as they recommend
        uses: pypa/gh-action-pypi-publish@release/v1 # zizmor: ignore[unpinned-uses]
