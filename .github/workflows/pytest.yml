name: Run tests
on:
  push:
    branches:
      - main
  pull_request:

# Cancel if a newer run is started
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # CairoSVG dlopens the Cairo shared library, so the runtime package is enough
      - name: Install Cairo
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libcairo2

      - name: Install rich-codex and test dependencies
        run: pip install '.[dev,cairo]'

      # Coverage roughly doubles the runtime, so only measure it once
      - name: Run pytest
        if: matrix.python-version != '3.12'
        run: pytest

      - name: Run pytest with coverage
        if: matrix.python-version == '3.12'
        run: pytest --cov=rich_codex --cov-report=term-missing
