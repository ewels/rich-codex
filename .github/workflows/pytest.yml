name: Run tests
on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # CairoSVG needs system libraries to convert SVGs to PNG / PDF
      - name: Install Cairo
        run: sudo apt-get update && sudo apt-get install --yes libcairo2-dev

      - name: Install rich-codex and test dependencies
        run: python -m pip install --upgrade pip && pip install '.[dev,cairo]'

      - name: Run pytest
        run: pytest --cov=rich_codex --cov-report=term-missing
