name: Build images / docs
on: [push]

# Cancel if a newer run is started
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rich_codex:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - uses: actions/cache@v4
        with:
          key: ${{ github.ref }}
          path: .cache

      # Install rich-codex from this checkout, so that screenshots of its own
      # CLI show the code in this branch and not the last release on PyPI
      - name: Install rich-codex and requirements for docs
        run: pip install -e ".[cairo]" cowsay lolcat mkdocs-material pillow rich-cli

      - name: Generate terminal images with rich-codex
        uses: ./ # Would normally be ewels/rich-codex@v1
        with:
          commit_changes: "true"
          clean_img_paths: docs/img/*.svg
          skip_python_setup: "true" # Set up above, so that the install below is the one used
          skip_install: "true" # Installed from this checkout above

      - name: Build and deploy docs
        if: github.ref == 'refs/heads/main'
        run: mkdocs gh-deploy --force
