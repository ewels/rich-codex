name: Build images / docs
on: [push]

# Cancel if a newer run is started
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rich_codex:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      # Install rich-codex from this checkout, so that screenshots of its own
      # CLI show the code in this branch and not the last release on PyPI.
      # The action is told to skip both, as they're set up here instead.
      - name: Install rich-codex and the tools used in screenshots
        run: pip install -e ".[cairo]" cowsay lolcat rich-cli

      - name: Generate terminal images with rich-codex
        uses: ./ # Would normally be ewels/rich-codex@v1
        with:
          commit_changes: "true"
          clean_img_paths: docs/img/*.svg
          skip_python_setup: "true"
          skip_install: "true"

      # Docs are only published from main, so everything below is skipped on branches
      - uses: actions/cache@v4
        if: github.ref == 'refs/heads/main'
        with:
          key: ${{ github.ref }}
          path: .cache

      - name: Install requirements for docs
        if: github.ref == 'refs/heads/main'
        run: pip install mkdocs-material pillow

      - name: Build and deploy docs
        if: github.ref == 'refs/heads/main'
        run: mkdocs gh-deploy --force
