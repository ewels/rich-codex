name: Build images / docs
on:
  push:
    # Anything that can change a screenshot or the docs site
    paths:
      - "docs/**"
      - "src/**"
      - "README.md"
      - "mkdocs.yml"
      - "action.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/build-docs.yml"

# Cancel if a newer run is started
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rich_codex:
    runs-on: ubuntu-latest
    # Needs write access to commit new screenshots and to deploy the docs
    permissions:
      contents: write
    steps:
      # Credentials are deliberately kept, as this job commits screenshots and deploys the docs
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.x

      # Cache for the social card images generated by mkdocs-material
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: mkdocs-${{ github.ref }}
          restore-keys: mkdocs-
          path: .cache

      # Install rich-codex from this checkout, so that screenshots of its own
      # CLI show the code in this branch and not the last release on PyPI.
      # The action is told to skip Python and the install, as we do both here.
      - name: Install rich-codex and requirements for docs
        run: pip install -e ".[cairo]" cowsay lolcat rich-cli mkdocs-material pillow

      - name: Generate terminal images with rich-codex
        uses: ./ # Would normally be ewels/rich-codex@v1
        with:
          commit_changes: "true"
          clean_img_paths: docs/img/*.svg
          skip_python_setup: "true"
          skip_install: "true"

      # Check that the docs still build on every branch, but only publish from main
      - name: Build docs
        if: github.ref != 'refs/heads/main'
        run: mkdocs build --strict

      - name: Build and deploy docs
        if: github.ref == 'refs/heads/main'
        run: mkdocs gh-deploy --force --strict
