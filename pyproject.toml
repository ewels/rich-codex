[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools>=45",
]

[project]
name = "rich-codex"
description = "Generate rich images for the GitHub Action 'rich-codex'"
readme = "README.md"
license = "MIT"
maintainers = [ { name = "Phil Ewels", email = "phil@ewels.co.uk" } ]
authors = [ { name = "Phil Ewels", email = "phil@ewels.co.uk" } ]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dynamic = [ "version" ]
dependencies = [ "gitpython", "jsonschema", "levenshtein>=0.18.1", "pyyaml", "rich>=12.4.3", "rich-click>=1.9" ]
optional-dependencies.cairo = [ "cairosvg>=2.5.2" ]
optional-dependencies.dev = [
    "mypy",
    "prek",
    "pytest",
    "pytest-cov",
    "ruff",
    "types-pyyaml",
]
urls."Issue Tracker" = "https://github.com/ewels/rich-codex/issues"
urls."Source Code" = "https://github.com/ewels/rich-codex"
urls.Documentation = "https://github.com/ewels/rich-codex"
scripts.rich-codex = "rich_codex.cli:main"

[tool.setuptools]
packages.find.where = [ "src" ]
package-data.rich_codex = [ "config-schema.yml" ]
dynamic.version = { attr = "rich_codex.__version__" }

# Ruff covers formatting, linting, import order and syntax modernisation.
# The Python version for 'UP' rules is taken from 'requires-python' above.
[tool.ruff]
line-length = 120
lint.select = [
    "D",    # pydocstyle
    "E",    # pycodestyle
    "F",    # pyflakes
    "I001", # isort
    "UP",   # pyupgrade
    "W",    # pycodestyle
]
lint.ignore = [
    "D100", # Missing docstring in public module
    "D102", # Missing docstring in public method
    "D105", # Missing docstring in magic method
    "D203", # 1 blank line required before class docstring
    "D205", # 1 blank line required between summary line and description
    "D213", # Multi-line docstring summary should start at the second line
    "E731", # Do not assign a lambda expression, use a def
]
lint.exclude = [
    "examples/**",
]
lint.per-file-ignores."tests/**/*.py" = [
    "D",
]
lint.isort.known-first-party = [ "rich_codex" ]
# Keep 'import rich_click as click' in a section of its own, after everything else
lint.isort.section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
    "richclick",
]
lint.isort.sections.richclick = [ "rich_click" ]

[tool.pyproject-fmt]
indent = 4

# Only 'src' is annotated so far, so that's all mypy is pointed at. The tests are
# excluded rather than annotated, which would be a much larger job for less benefit.
[tool.mypy]
files = [ "src" ]
ignore_missing_imports = true
python_version = "3.10"
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
scripts_are_modules = true

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.addopts = "-ra"

[tool.coverage]
run.source = [ "src/rich_codex" ]
report.exclude_lines = [
    'if __name__ == "__main__":',
    "pragma: no cover",
]
